name: Saturn-Node CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: saturn-node-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version
      - name: Validate manifest
        run: swift package dump-package >/dev/null
      - name: Validate workload compute contract
        run: python3 scripts/validate_saturn_node_contract.py
      - name: Build and test
        run: swift test --parallel
      - name: Verify fail-closed executable
        run: swift run saturn-node
