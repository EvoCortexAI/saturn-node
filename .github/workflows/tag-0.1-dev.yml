name: Cue 0.1.x development tag

on:
  workflow_run:
    workflows: ["Saturn-Node CI"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: saturn-node-0.1-cue
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the green main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Allocate and publish the next 0.1.x tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          existing="$(git tag --points-at "$TARGET_SHA" | grep -E '^0\.1\.[0-9]+$' || true)"
          if [[ -n "$existing" ]]; then
            echo "SHA $TARGET_SHA already carries $existing"
            exit 0
          fi

          latest_patch="$(git tag -l '0.1.*' \
            | sed -n 's/^0\.1\.\([0-9][0-9]*\)$/\1/p' \
            | sort -n \
            | tail -1)"
          latest_patch="${latest_patch:-0}"
          next_patch=$((latest_patch + 1))
          tag="0.1.${next_patch}"

          git config user.name "saturn-node-cue"
          git config user.email "noreply@evocortex.ai"
          git tag -a "$tag" "$TARGET_SHA" -m "Saturn-Node $tag"
          git push origin "refs/tags/$tag"

          notes="Development cue ${tag}

Provenance SHA: ${TARGET_SHA}
Compatibility line: 0.1.x
License: Apache License 2.0

Consumers resolve this line with .upToNextMinor(from: \"0.1.0\") and a committed Package.resolved.
Cueing does not authorize a listener, production verifier, launchd, or SN01. The immutable 0.1.0 tag is not retargeted."

          gh release create "$tag" \
            --target "$TARGET_SHA" \
            --title "Saturn-Node $tag" \
            --notes "$notes" \
            --latest
